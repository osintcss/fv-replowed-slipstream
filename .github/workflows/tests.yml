name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Laravel and Pest
    runs-on: ubuntu-latest

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: farmville_test
          MARIADB_USER: farmville_test
          MARIADB_PASSWORD: test-password
          MARIADB_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uroot -proot-password --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: farmville_test
      DB_USERNAME: farmville_test
      DB_PASSWORD: test-password
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: test-app
      REVERB_APP_KEY: test-key
      REVERB_APP_SECRET: test-secret
      PULSE_ENABLED: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create test environment file
        run: cp .env.example .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: php artisan test --colors=always --display-warnings
